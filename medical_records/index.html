// ============ GitHub Gist Sync ============
const gistSync = {
  getConfig() {
    try { return JSON.parse(localStorage.getItem(GIST_CONFIG_KEY) || "{}"); } catch { return {}; }
  },
  saveConfig(cfg) { localStorage.setItem(GIST_CONFIG_KEY, JSON.stringify(cfg)); },
  isConfigured() { const c = this.getConfig(); return !!(c.token); },

  async createGist(token, aiConfig) {
    const resp = await fetch("https://api.github.com/gists", {
      method: "POST",
      headers: { "Authorization": "token " + token, "Content-Type": "application/json" },
      body: JSON.stringify({
        description: "家庭诊疗记录数据",
        public: false,
        files: { [GIST_FILENAME]: { content: JSON.stringify({ members: [], records: [], aiConfig: aiConfig || {}, syncedAt: new Date().toISOString() }) } },
      }),
    });
    if (!resp.ok) throw new Error("创建 Gist 失败: " + resp.status);
    const data = await resp.json();
    return data.id;
  },

  async pull(token, gistId) {
    const resp = await fetch("https://api.github.com/gists/" + gistId, {
      headers: { "Authorization": "token " + token },
    });
    if (!resp.ok) throw new Error("拉取失败: " + resp.status);
    const data = await resp.json();
    const file = data.files?.[GIST_FILENAME];
    if (!file) throw new Error("Gist 中没有找到数据文件");
    return JSON.parse(file.content);
  },

  async push(token, gistId, data, aiConfig, retries) {
    retries = retries || 0;
    const payload = Object.assign({}, data, { syncedAt: new Date().toISOString() });
    if (aiConfig) payload.aiConfig = aiConfig;
    var tc = tosHelper.getConfig();
    if (tc && tc.accessKeyId) payload.tosConfig = tc;
    const resp = await fetch("https://api.github.com/gists/" + gistId, {
      method: "PATCH",
      headers: { "Authorization": "token " + token, "Content-Type": "application/json" },
      body: JSON.stringify({
        files: { [GIST_FILENAME]: { content: JSON.stringify(payload) } },
      }),
    });
    if (resp.status === 409 && retries < 2) {
      // Conflict — wait and retry
      await new Promise(function(r) { setTimeout(r, 1000); });
      return this.push(token, gistId, data, aiConfig, retries + 1);
    }
    if (!resp.ok) throw new Error("推送失败: " + resp.status);
    return true;
  },

  mergeData(local, remote) {
    // Merge members while honoring tombstones from both sides
    const localMembers = local.members || [];
    const remoteMembers = remote.members || [];
    const deletedMemberIds = new Set([...(local.deletedMemberIds || []), ...(remote.deletedMemberIds || [])]);
    const memberMap = new Map();
    for (const m of remoteMembers) {
      if (!deletedMemberIds.has(m.id)) memberMap.set(m.id, m);
    }
    for (const m of localMembers) {
      if (deletedMemberIds.has(m.id)) {
        memberMap.delete(m.id);
        continue;
      }
      memberMap.set(m.id, m);
    }
    const mergedMembers = [...memberMap.values()];

    // Collect deleted IDs from both sides
    const deletedIds = new Set([...(local.deletedIds || []), ...(remote.deletedIds || [])]);

    // Merge records: union by id, prefer newer (higher createdAt), exclude deleted
    const localRecords = local.records || [];
    const remoteRecords = remote.records || [];
    const recordMap = new Map();
    for (const r of remoteRecords) { if (!deletedIds.has(r.id)) recordMap.set(r.id, r); }
    for (const r of localRecords) {
      if (deletedIds.has(r.id)) { recordMap.delete(r.id); continue; }
      const existing = recordMap.get(r.id);
      if (!existing || (r.createdAt || 0) >= (existing.createdAt || 0)) {
        recordMap.set(r.id, r);
      }
    }
    const mergedRecords = [...recordMap.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    return { members: mergedMembers, records: mergedRecords, deletedIds: [...deletedIds], deletedMemberIds: [...deletedMemberIds] };
  },
};

// ============ TOS Image Storage ============
const TOS_CONFIG_KEY = "tos-config";
const tosHelper = {
  getConfig() {
    try { return JSON.parse(localStorage.getItem(TOS_CONFIG_KEY) || "{}"); } catch { return {}; }
  },
  saveConfig(cfg) { localStorage.setItem(TOS_CONFIG_KEY, JSON.stringify(cfg)); },
  isConfigured() { var c = this.getConfig(); return !!(c.accessKeyId && c.accessKeySecret && c.bucket); },
  getClient() {
    var c = this.getConfig();
    if (!c.accessKeyId || !c.accessKeySecret || !c.bucket) return null;
    var region = c.region || "cn-beijing";
    return new TOS({
      accessKeyId: c.accessKeyId,
      accessKeySecret: c.accessKeySecret,
      region: region,
      endpoint: "tos-" + region + ".volces.com",
      bucket: c.bucket,
    });
  },
  async upload(file, recordId) {
    var client = this.getClient();
    if (!client) throw new Error("TOS 未配置");
    var ext = (file.name || "photo.jpg").split(".").pop().toLowerCase();
    var key = "medical-images/" + recordId + "." + ext;
    await client.putObject({ key: key, body: file });
    var c = this.getConfig();
    var region = c.region || "cn-beijing";
    return "https://" + c.bucket + ".tos-" + region + ".volces.com/" + key;
  },
  async uploadBase64(base64DataUrl, recordId) {
    var parts = base64DataUrl.split(",");
    var mime = parts[0].match(/:(.*?);/)[1];
    var ext = mime.split("/")[1] || "jpg";
    var bstr = atob(parts[1]);
    var arr = new Uint8Array(bstr.length);
    for (var i = 0; i < bstr.length; i++) arr[i] = bstr.charCodeAt(i);
    var blob = new Blob([arr], { type: mime });
    var file = new File([blob], recordId + "." + ext, { type: mime });
    return this.upload(file, recordId);
  },
  async uploadThumb(base64DataUrl, recordId) {
    var parts = base64DataUrl.split(",");
    var mime = parts[0].match(/:(.*?);/)[1];
    var ext = mime.split("/")[1] || "jpg";
    var bstr = atob(parts[1]);
    var arr = new Uint8Array(bstr.length);
    for (var i = 0; i < bstr.length; i++) arr[i] = bstr.charCodeAt(i);
    var blob = new Blob([arr], { type: mime });
    var key = "medical-images/" + recordId + "_thumb." + ext;
    var client = this.getClient();
    if (!client) throw new Error("TOS 未配置");
    await client.putObject({ key: key, body: blob });
    var c = this.getConfig();
    var region = c.region || "cn-beijing";
    return "https://" + c.bucket + ".tos-" + region + ".volces.com/" + key;
  },
};

// Strip base64 image data from record for sync/export (keep TOS URLs)
function stripBase64(rec) {
  var o = Object.assign({}, rec);
  delete o.imageData; delete o.imageThumb;
  if (o.images) {
    o.images = o.images.map(function(img) {
      if (img.imageUrl) return { imageUrl: img.imageUrl, thumbUrl: img.thumbUrl };
      return null;
    }).filter(Boolean);
  }
  return o;
}

async function extractFromImage(base64Data, mediaType, config) {
  try {
    const baseUrl = config.url.replace(/\/$/, "");
    const apiType = config.apiType || "responses";
    let url, body;

    if (apiType === "responses") {
      url = baseUrl + "/responses";
      body = {
        model: config.endpoint,
        thinking: { type: "disabled" },
        text: { format: MEDICAL_RECORD_SCHEMA },
        input: [
          { role: "system", content: PROMPT_TEXT },
          { role: "user", content: [
            { type: "input_image", image_url: "data:" + mediaType + ";base64," + base64Data },
            { type: "input_text", text: "请识别这张医疗单据/报告的内容。" },
          ]},
        ],
      };
    } else {
      url = baseUrl + "/chat/completions";
      body = {
        model: config.endpoint,
        max_tokens: 1000,
        messages: [
          { role: "system", content: PROMPT_TEXT },
          { role: "user", content: [
            { type: "image_url", image_url: { url: "data:" + mediaType + ";base64," + base64Data } },
            { type: "text", text: "请识别这张医疗单据/报告的内容，以JSON格式返回。" },
          ]},
        ],
      };
    }

    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + config.apiKey },
      body: JSON.stringify(body),
    });
    const data = await response.json();

    var text = "";
    if (apiType === "responses") {
      text = (data.output || []).filter(function(o) { return o.type === "message"; }).map(function(o) { return (o.content || []).filter(function(c) { return c.type === "output_text"; }).map(function(c) { return c.text; }).join(""); }).join("") || "";
    } else {
      text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
    }
    var clean = text.replace(/```json|```/g, "").trim();
    return JSON.parse(clean);
  } catch (e) {
    console.error("OCR failed:", e);
    return null;
  }
}

async function extractFromText(text, type, config) {
  try {
    var baseUrl = config.url.replace(/\/$/, "");
    var apiType = config.apiType || "responses";
    var typePrompt = TYPE_PROMPTS[type] || TYPE_PROMPTS.note;
    var sysPrompt = "你是医疗记录解析助手。用户会提供一段关于医疗/健康的文字描述，请从中提取结构化信息。无法确定的字段填空字符串或空数组。type固定填\"" + type + "\"。\n" + typePrompt;
    var url, body;

    if (apiType === "responses") {
      url = baseUrl + "/responses";
      body = {
        model: config.endpoint,
        thinking: { type: "disabled" },
        text: { format: MEDICAL_RECORD_SCHEMA },
        input: [
          { role: "system", content: sysPrompt },
          { role: "user", content: [{ type: "input_text", text: text }] },
        ],
      };
    } else {
      url = baseUrl + "/chat/completions";
      body = {
        model: config.endpoint, max_tokens: 1000,
        messages: [
          { role: "system", content: sysPrompt },
          { role: "user", content: text },
        ],
      };
    }

    var response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + config.apiKey },
      body: JSON.stringify(body),
    });
    var data = await response.json();
    var resultText = "";
    if (apiType === "responses") {
      resultText = (data.output || []).filter(function(o) { return o.type === "message"; }).map(function(o) { return (o.content || []).filter(function(c) { return c.type === "output_text"; }).map(function(c) { return c.text; }).join(""); }).join("") || "";
    } else {
      resultText = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
    }
    return JSON.parse(resultText.replace(/```json|```/g, "").trim());
  } catch (e) {
    console.error("Text extraction failed:", e);
    return null;
  }
}

function MultiImageAttachment({ images, onChange }) {
  var fileRef = useRef();

  var handleFile = function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      var fullData = reader.result;
      var img = new Image();
      img.onload = function() {
        var c = document.createElement("canvas");
        var s = 88 / Math.max(img.width, img.height);
        c.width = img.width * s; c.height = img.height * s;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        onChange(images.concat([{ imageData: fullData, imageThumb: c.toDataURL("image/jpeg", 0.7) }]));
      };
      img.src = fullData;
    };
    reader.readAsDataURL(file);
    if (fileRef.current) fileRef.current.value = "";
  };

  var handleRemove = function(idx) { onChange(images.filter(function(_, i) { return i !== idx; })); };

  return (
    <div style={{ marginBottom: 10 }}>
      <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
      {images.length > 0 && (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
          {images.map(function(img, i) {
            var src = img.thumbUrl || img.imageThumb || img.imageUrl || img.imageData;
            return (
              <div key={i} style={{ position: "relative", display: "inline-block" }}>
                <img src={src} alt="" style={{ width: 64, height: 64, borderRadius: 10, objectFit: "cover" }} />
                <button onClick={function() { handleRemove(i); }} style={{
                  position: "absolute", top: -6, right: -6, width: 20, height: 20, borderRadius: "50%",
                  border: "none", background: "#c06b5d", color: "#fff", fontSize: 12,
                  cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                }}>×</button>
              </div>
            );
          })}
        </div>
      )}
      <button onClick={function() { fileRef.current && fileRef.current.click(); }} style={{
        padding: "8px 14px", borderRadius: 8, border: "1.5px dashed #d0cdc5", background: "#faf9f7",
        fontSize: 12, color: "#aaa", cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif",
      }}>📎 添加图片</button>
    </div>
  );
}

function ItemList({ items, onChange, nameLabel, valueLabel, valueKey }) {
  var handleChange = function(idx, field, val) {
    var next = items.map(function(item, i) {
      if (i !== idx) return item;
      var o = Object.assign({}, item); o[field] = val; return o;
    });
    onChange(next);
  };
  var handleAdd = function() {
    var o = { name: "" }; o[valueKey] = "";
    onChange(items.concat([o]));
  };
  var handleRemove = function(idx) { onChange(items.filter(function(_, i) { return i !== idx; })); };
  var rowStyle = { display: "flex", gap: 6, marginBottom: 6, alignItems: "center" };
  var inputStyle = {
    flex: 1, padding: "8px 10px", borderRadius: 8, border: "1.5px solid #e8e5e0",
    fontSize: 13, fontFamily: "'Noto Sans SC', sans-serif", background: "#faf9f7", outline: "none", boxSizing: "border-box",
  };
  return (
    <div style={{ marginBottom: 8 }}>
      {items.map(function(item, i) {
        return (
          <div key={i} style={rowStyle}>
            <input placeholder={nameLabel} value={item.name} onChange={function(e) { handleChange(i, "name", e.target.value); }} style={inputStyle} />
            <input placeholder={valueLabel} value={item[valueKey] || ""} onChange={function(e) { handleChange(i, valueKey, e.target.value); }} style={inputStyle} />
            <button onClick={function() { handleRemove(i); }} style={{
              width: 24, height: 24, borderRadius: "50%", border: "none", background: "#f5e6e3",
              color: "#c06b5d", fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
            }}>×</button>
          </div>
        );
      })}
      <button onClick={handleAdd} style={{
        padding: "6px 12px", borderRadius: 8, border: "1.5px dashed #d0cdc5", background: "#faf9f7",
        fontSize: 12, color: "#aaa", cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif",
      }}>+ {nameLabel}</button>
    </div>
  );
}

function TypedFormFields({ type, state, setState, inputStyle }) {
  var fields = TYPE_FIELDS[type] || TYPE_FIELDS.note;
  var set = function(k) { return function(e) { var o = {}; o[k] = e.target.value; setState(Object.assign({}, state, o)); }; };
  var setArr = function(k) { return function(arr) { var o = {}; o[k] = arr; setState(Object.assign({}, state, o)); }; };
  return (
    <>
      <input type="date" value={state.date} onChange={set("date")} style={Object.assign({}, inputStyle, { marginBottom: 8 })} />
      <input placeholder={fields.summary} value={state.summary} onChange={set("summary")} style={Object.assign({}, inputStyle, { marginBottom: 8 })} autoFocus />
      {fields.hospital && <input placeholder={fields.hospital === true ? "医院" : "医院（选填）"} value={state.hospital} onChange={set("hospital")} style={Object.assign({}, inputStyle, { marginBottom: 8 })} />}
      {fields.doctor && <input placeholder={fields.doctor === true ? "医生" : "医生（选填）"} value={state.doctor} onChange={set("doctor")} style={Object.assign({}, inputStyle, { marginBottom: 8 })} />}
      {fields.diagnosis && <input placeholder={fields.diagnosis === true ? "诊断" : "诊断（选填）"} value={state.diagnosis} onChange={set("diagnosis")} style={Object.assign({}, inputStyle, { marginBottom: 8 })} />}
      {fields.medications && <ItemList items={state.medications || []} onChange={setArr("medications")} nameLabel="药名" valueLabel="用法用量" valueKey="dosage" />}
      {fields.tests && <ItemList items={state.tests || []} onChange={setArr("tests")} nameLabel="检查项" valueLabel="结果" valueKey="result" />}
      {fields.notes && <textarea placeholder="补充备注（选填）" value={state.notes} onChange={set("notes")} rows={2} style={Object.assign({}, inputStyle, { marginBottom: 8, resize: "vertical" })} />}
    </>
  );
}

// Helper: convert old single-image record to images array
function getRecordImages(record) {
  if (record.images && record.images.length) return record.images;
  if (record.imageUrl) return [{ imageUrl: record.imageUrl, thumbUrl: record.thumbUrl }];
  if (record.imageData) return [{ imageData: record.imageData, imageThumb: record.imageThumb }];
  return [];
}

function EditForm({ record, members, onSave, onCancel }) {
  const [memberId, setMemberId] = useState(record.memberId);
  const [type, setType] = useState(record.type || "visit");
  const [formState, setFormState] = useState({
    date: record.date || "", summary: record.summary || "", hospital: record.hospital || "",
    doctor: record.doctor || "", diagnosis: record.diagnosis || "",
    medications: record.medications || [], tests: record.tests || [], notes: record.notes || "",
  });
  const [images, setImages] = useState(getRecordImages(record));
  const [saving, setSaving] = useState(false);

  var handleSave = async function() {
    if (!formState.summary.trim() || saving) return;
    setSaving(true);
    var updated = Object.assign({}, record, {
      memberId: memberId, type: type, date: formState.date, summary: formState.summary.trim(),
      hospital: formState.hospital, doctor: formState.doctor, diagnosis: formState.diagnosis,
      medications: (formState.medications || []).filter(function(m) { return m.name.trim(); }),
      tests: (formState.tests || []).filter(function(t) { return t.name.trim(); }),
      notes: formState.notes,
    });
    // Clear old single-image fields
    delete updated.imageUrl; delete updated.thumbUrl; delete updated.imageData; delete updated.imageThumb;
    // Upload new images to TOS
    if (images.length > 0) {
      var uploaded = [];
      for (var i = 0; i < images.length; i++) {
        var img = images[i];
        if (img.imageUrl) { uploaded.push({ imageUrl: img.imageUrl, thumbUrl: img.thumbUrl }); continue; }
        if (img.imageData && tosHelper.isConfigured()) {
          try {
            var imgId = record.id + "-" + i + "-" + Date.now();
            var u = await tosHelper.uploadBase64(img.imageData, imgId);
            var t = await tosHelper.uploadThumb(img.imageThumb, imgId);
            uploaded.push({ imageUrl: u, thumbUrl: t });
          } catch (e) { uploaded.push({ imageData: img.imageData, imageThumb: img.imageThumb }); }
        } else if (img.imageData) {
          uploaded.push({ imageData: img.imageData, imageThumb: img.imageThumb });
        }
      }
      updated.images = uploaded;
    } else {
      updated.images = [];
    }
    setSaving(false);
    onSave(updated);
  };

  var inputStyle = {
    width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid #e8e5e0",
    fontSize: 14, fontFamily: "'Noto Sans SC', sans-serif", background: "#faf9f7", outline: "none", boxSizing: "border-box",
  };

  return (
    <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 10, boxShadow: "0 2px 12px rgba(0,0,0,0.08)" }} onClick={function(e) { e.stopPropagation(); }}>
      <div style={{ fontSize: 14, fontWeight: 600, color: "#333", marginBottom: 12, fontFamily: "'Noto Sans SC', sans-serif" }}>编辑记录</div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
        {members.map(function(m) { return <MemberPill key={m.id} member={m} selected={memberId === m.id} onClick={function() { setMemberId(m.id); }} />; })}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
        {RECORD_TYPES.map(function(t) { return <TypeChip key={t.key} type={t} selected={type === t.key} onClick={function() { setType(t.key); }} />; })}
      </div>
      <TypedFormFields type={type} state={formState} setState={setFormState} inputStyle={inputStyle} />
      <MultiImageAttachment images={images} onChange={setImages} />
      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={onCancel} style={{ flex: 1, padding: "10px", borderRadius: 12, border: "1.5px solid #e8e5e0", background: "#fff", fontSize: 13, color: "#888", cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif" }}>取消</button>
        <button onClick={handleSave} disabled={saving} style={{ flex: 2, padding: "10px", borderRadius: 12, border: "none", background: (formState.summary.trim() && !saving) ? "#4A7C6F" : "#ccc", color: "#fff", fontSize: 13, fontWeight: 600, cursor: (formState.summary.trim() && !saving) ? "pointer" : "default", fontFamily: "'Noto Sans SC', sans-serif" }}>{saving ? "保存中..." : "保存修改"}</button>
      </div>
    </div>
  );
}

function AiTextModal({ type, aiConfig, onResult, onClose }) {
  var [text, setText] = useState("");

    if (!text.trim()) return;

    setStatus("processing");
    var result = await extractFromText(text, type, aiConfig);
    if (result) { onResult(result); onClose(); }
    else { setStatus("error"); }
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={onClose}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 24, maxWidth: 420, width: "100%" }} onClick={function(e) { e.stopPropagation(); }}>

        }} autoFocus />

        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={onClose} style={{ flex: 1, padding: "10px", borderRadius: 12, border: "1.5px solid #e8e5e0", background: "#fff", fontSize: 14, color: "#888", cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif" }}>取消</button>
          <button onClick={handleExtract} disabled={status === "processing" || !text.trim()} style={{

            cursor: (text.trim() && status !== "processing") ? "pointer" : "default", fontFamily: "'Noto Sans SC', sans-serif",
          }}>{status === "processing" ? "识别中..." : "识别并填入"}</button>
        </div>
      </div>
    </div>
  );
}

function PhotoCapture({ members, onSave, onCancel, aiConfig, defaultMemberId }) {
  const [memberId, setMemberId] = useState(defaultMemberId || members[0]?.id);
  const [status, setStatus] = useState("idle"); // idle | processing | done | error | form
  const [extracted, setExtracted] = useState(null);
  const [imageData, setImageData] = useState(null);
  const [imageThumb, setImageThumb] = useState(null);
  const fileRef = useRef();

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!aiConfig || !aiConfig.apiKey || !aiConfig.url || !aiConfig.endpoint) { alert("请先在设置中填写火山引擎配置"); return; }
    setStatus("processing");
    const fullData = await new Promise(function(res) { var r = new FileReader(); r.onload = function() { res(r.result); }; r.readAsDataURL(file); });
    setImageData(fullData);
    const thumb = await new Promise(function(res) {
      var img = new Image();
      img.onload = function() { var c = document.createElement("canvas"); var s = 88 / Math.max(img.width, img.height); c.width = img.width * s; c.height = img.height * s; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", 0.7)); };
      img.src = fullData;
    });
    setImageThumb(thumb);
    var base64 = fullData.split(",")[1];
    var mediaType = file.type || "image/jpeg";
    var result = await extractFromImage(base64, mediaType, aiConfig);
    if (result) { setExtracted(result); setStatus("done"); } else { setStatus("error"); }
  };

  // "下一步" — go to form with pre-filled data
  var handleNext = function() { setStatus("form"); };

  return (
    <div style={{ padding: "0 0 20px" }}>
      {status !== "form" && (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          {members.map(function(m) { return <MemberPill key={m.id} member={m} selected={memberId === m.id} onClick={function() { setMemberId(m.id); }} />; })}
        </div>
      )}
      {status === "idle" && (
        <div>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={handleFile} style={{ display: "none" }} />
          <button onClick={function() { fileRef.current && fileRef.current.click(); }} style={{
            width: "100%", padding: "40px 20px", borderRadius: 16, border: "2px dashed #d0cdc5",
            background: "#faf9f7", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 8,
          }}>
            <span style={{ fontSize: 36 }}>📸</span>

function MemberManager({ members, onUpdate }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(members);
  const [newName, setNewName] = useState("");
  const [newEmoji, setNewEmoji] = useState("👤");
  const colors = ["#4A7C6F", "#C06B5D", "#7B6B8D", "#5B7FA5", "#A08C5B", "#5BA07C"];

  var updateMemberField = function(id, field, value) {
    setDraft(draft.map(function(m) { return m.id === id ? Object.assign({}, m, {[field]: value}) : m; }));
  };
  const handleAdd = () => {
    if (!newName.trim() || draft.length >= 8) return;
    setDraft([...draft, { id: createId(), name: newName.trim(), avatar: newEmoji || "👤", color: colors[draft.length % colors.length] }]);
    setNewName(""); setNewEmoji("👤");
  };
  const handleRemove = (id) => { if (draft.length <= 1) return; setDraft(draft.filter((m) => m.id !== id)); };
  const handleSave = () => { onUpdate(draft); setEditing(false); };

  if (!editing) return (
    <button onClick={() => { setEditing(true); setDraft(members); }} style={{
      padding: "6px 14px", borderRadius: 10, border: "1.5px solid rgba(255,255,255,0.3)", background: "rgba(255,255,255,0.15)",
      fontSize: 12, color: "rgba(255,255,255,0.8)", cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif",
    }}>管理成员</button>
  );

  return (
    <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 16, boxShadow: "0 2px 12px rgba(0,0,0,0.08)" }}>
      {draft.map((m) => (
        <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
          <input value={m.avatar} onChange={function(e) { updateMemberField(m.id, "avatar", e.target.value); }} style={{
            width: 36, height: 36, textAlign: "center", fontSize: 20, padding: 0, borderRadius: 8,
            border: "1.5px solid #e8e5e0", background: "#faf9f7", outline: "none",
          }} />
          <input value={m.name} onChange={function(e) { updateMemberField(m.id, "name", e.target.value); }} style={{
            flex: 1, padding: "6px 10px", borderRadius: 8, border: "1.5px solid #e8e5e0",
            fontSize: 14, fontFamily: "'Noto Sans SC', sans-serif", outline: "none",
          }} />
          {draft.length > 1 && (
            <button onClick={() => handleRemove(m.id)} style={{
              width: 24, height: 24, borderRadius: "50%", border: "none", background: "#f5e6e3",
              color: "#c06b5d", fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
            }}>×</button>
          )}
        </div>
      ))}
      {draft.length < 8 && (
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <input value={newEmoji} onChange={(e) => setNewEmoji(e.target.value)} placeholder="😀" style={{
            width: 36, height: 36, textAlign: "center", fontSize: 18, padding: 0, borderRadius: 8,
            border: "1.5px solid #e8e5e0", background: "#faf9f7", outline: "none",
          }} />
          <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="新成员姓名" style={{
            flex: 1, padding: "8px 12px", borderRadius: 10, border: "1.5px solid #e8e5e0", fontSize: 13, fontFamily: "'Noto Sans SC', sans-serif", outline: "none",
          }} onKeyDown={(e) => e.key === "Enter" && handleAdd()} />
          <button onClick={handleAdd} style={{
            padding: "8px 14px", borderRadius: 10, border: "none", background: newName.trim() ? "#4A7C6F" : "#ddd",
            color: "#fff", fontSize: 13, cursor: newName.trim() ? "pointer" : "default", fontFamily: "'Noto Sans SC', sans-serif",
          }}>添加</button>
        </div>

      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>

function SyncSettingsModal({ onClose, onSyncDone, aiConfig }) {
  const [config, setConfig] = useState(gistSync.getConfig());
  const [token, setToken] = useState(config.token || "");
  const [gistId, setGistId] = useState(config.gistId || "");
  const [status, setStatus] = useState("idle"); // idle | syncing | success | error
  const [msg, setMsg] = useState("");

  const inputStyle = {
    width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid #e8e5e0",
    fontSize: 13, fontFamily: "'JetBrains Mono', monospace", background: "#faf9f7", outline: "none", boxSizing: "border-box", marginBottom: 10,
  };

  const handleSave = () => {
    gistSync.saveConfig({ token, gistId });
    setConfig({ token, gistId });
    setMsg("配置已保存");
    setTimeout(() => setMsg(""), 2000);
  };

  const handleInitGist = async () => {
    if (!token) { setMsg("请先填写 GitHub Token"); return; }
    setStatus("syncing"); setMsg("正在创建 Gist...");
    try {
      const newId = await gistSync.createGist(token, aiConfig);
      setGistId(newId);
      gistSync.saveConfig({ token, gistId: newId });
      setConfig({ token, gistId: newId });
      setStatus("success"); setMsg("Gist 创建成功！ID: " + newId);
    } catch (e) {
      setStatus("error"); setMsg(e.message);
    }
  };

  const handleSync = async () => {
    if (!token || !gistId) { setMsg("请先完成配置"); return; }
    // Auto save config before syncing
    gistSync.saveConfig({ token, gistId });
    setConfig({ token, gistId });
    setStatus("syncing"); setMsg("正在同步...");
    try {
      // Pull remote
      const remote = await gistSync.pull(token, gistId);
      // Load local
      const local = await storage.load() || { members: [], records: [] };
      // Strip images from records before pushing
      const localDeleted = JSON.parse(localStorage.getItem("deleted-record-ids") || "[]");
      const localForSync = { members: local.members, records: local.records.map(r => { return stripBase64(r); }), deletedIds: localDeleted };
      const remoteClean = { members: remote.members || [], records: (remote.records || []), deletedIds: remote.deletedIds || [] };
      // Merge
      const merged = gistSync.mergeData(localForSync, remoteClean);
      // Determine aiConfig to push: prefer local if it has values, otherwise use remote
      const localAi = aiConfig && aiConfig.apiKey ? aiConfig : null;
      const remoteAi = remote.aiConfig || null;
      const mergedAi = localAi || remoteAi || {};
      // Push merged to Gist (including aiConfig)
      await gistSync.push(token, gistId, merged, mergedAi);
      // Restore local images to merged records
      const localImageMap = new Map();
      (local.records || []).forEach(r => { if (r.imageData) localImageMap.set(r.id, { imageData: r.imageData, imageThumb: r.imageThumb }); });
      const finalRecords = merged.records.map(r => {
        const imgs = localImageMap.get(r.id);
        return imgs ? { ...r, ...imgs } : r;
      });
      // Save locally
      const finalData = { members: merged.members, records: finalRecords };
      await storage.save(finalData);
      localStorage.setItem("deleted-record-ids", JSON.stringify(merged.deletedIds || []));
      // Restore aiConfig from remote if local is empty
      if (!localAi && remoteAi && remoteAi.apiKey) {
        localStorage.setItem("volcengine-config", JSON.stringify(remoteAi));
      }
      // Restore tosConfig from remote if local is empty
      if (remote.tosConfig && remote.tosConfig.accessKeyId && !tosHelper.isConfigured()) {
        tosHelper.saveConfig(remote.tosConfig);
      }
      setStatus("success"); setMsg(`同步完成！共 ${merged.records.length} 条记录`);
      if (onSyncDone) onSyncDone(finalData, mergedAi);
    } catch (e) {
      setStatus("error"); setMsg(e.message);
    }
  };

  const isConfigured = token && gistId;

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={onClose}>
      <div style={{ background: "#fff", borderRadius: 16, padding: 24, maxWidth: 400, width: "100%" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 8, fontFamily: "'Noto Sans SC', sans-serif" }}>云同步设置</div>
        <div style={{ fontSize: 12, color: "#888", marginBottom: 14, fontFamily: "'Noto Sans SC', sans-serif", lineHeight: 1.6 }}>
          通过 GitHub Gist 实现跨设备同步。需要一个 GitHub Personal Access Token（仅勾选 gist 权限）。
          <a href="https://github.com/settings/tokens/new?scopes=gist&description=medical-records-sync" target="_blank" rel="noopener" style={{ color: "#4A7C6F", marginLeft: 4 }}>去创建 Token</a>
        </div>

        <div style={{ fontSize: 12, color: "#666", marginBottom: 4, fontFamily: "'Noto Sans SC', sans-serif" }}>GitHub Token</div>
        <input value={token} onChange={(e) => setToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxx" type="password" style={inputStyle} />

        <div style={{ fontSize: 12, color: "#666", marginBottom: 4, fontFamily: "'Noto Sans SC', sans-serif" }}>Gist ID {!gistId && <span style={{ color: "#bbb" }}>（首次使用点击下方"创建"）</span>}</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <input value={gistId} onChange={(e) => setGistId(e.target.value)} placeholder="自动生成或手动填写" style={{ ...inputStyle, flex: 1, marginBottom: 0 }} />
          {!gistId && <button onClick={handleInitGist} disabled={status === "syncing"} style={{
            padding: "8px 14px", borderRadius: 10, border: "none", background: token ? "#4A7C6F" : "#ddd",
            color: "#fff", fontSize: 12, cursor: token ? "pointer" : "default", whiteSpace: "nowrap", fontFamily: "'Noto Sans SC', sans-serif",
          }}>创建</button>}
        </div>

        {msg && <div style={{
          fontSize: 12, padding: "8px 12px", borderRadius: 8, marginBottom: 10, fontFamily: "'Noto Sans SC', sans-serif",
          background: status === "error" ? "#fef2f0" : status === "success" ? "#f0f7f4" : "#f5f3f0",
          color: status === "error" ? "#c06b5d" : status === "success" ? "#4A7C6F" : "#888",
        }}>{status === "syncing" && <span style={{ display: "inline-block", width: 12, height: 12, border: "2px solid #e8e5e0", borderTopColor: "#4A7C6F", borderRadius: "50%", animation: "spin 0.8s linear infinite", verticalAlign: "middle", marginRight: 6 }} />}{msg}</div>}

        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={onClose} style={{ flex: 1, padding: "10px", borderRadius: 12, border: "1.5px solid #e8e5e0", background: "#fff", fontSize: 14, color: "#888", cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif" }}>关闭</button>
          <button onClick={handleSave} style={{ flex: 1, padding: "10px", borderRadius: 12, border: "1.5px solid #e8e5e0", background: "#fff", fontSize: 14, color: "#4A7C6F", fontWeight: 600, cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif" }}>保存配置</button>
          {isConfigured && <button onClick={handleSync} disabled={status === "syncing"} style={{
            flex: 1, padding: "10px", borderRadius: 12, border: "none",
            background: status === "syncing" ? "#aaa" : "#4A7C6F", color: "#fff", fontSize: 14, fontWeight: 600,
            cursor: status === "syncing" ? "default" : "pointer", fontFamily: "'Noto Sans SC', sans-serif",
          }}>同步</button>}
        </div>
      </div>
    </div>
  );
}

  const [loaded, setLoaded] = useState(false);
  const [aiConfig, setAiConfig] = useState(() => {
    try { return JSON.parse(localStorage.getItem("volcengine-config") || "{}"); } catch { return {}; }
  });
  const [showSettings, setShowSettings] = useState(false);
  const [showSync, setShowSync] = useState(false);
  const [syncStatus, setSyncStatus] = useState(""); // "" | "syncing" | "done" | "error"

  // Auto-sync on load
  useEffect(() => {
    storage.load().then(async (data) => {
      var localMembers = (data && data.members && data.members.length) ? data.members : null;
      if (localMembers) setMembers(localMembers);
      if (data && data.records && data.records.length) setRecords(data.records);
      setLoaded(true);
      // Auto pull from Gist if configured
      if (gistSync.isConfigured()) {
        try {
          setSyncStatus("syncing");
          const cfg = gistSync.getConfig();
          const remote = await gistSync.pull(cfg.token, cfg.gistId);
          const local = data || { members: [], records: [] };
          const localDeleted = JSON.parse(localStorage.getItem("deleted-record-ids") || "[]");
          const localDeletedMembers = JSON.parse(localStorage.getItem(DELETED_MEMBER_IDS_KEY) || "[]");
          const localForSync = { members: local.members, records: (local.records || []).map(r => { return stripBase64(r); }), deletedIds: localDeleted, deletedMemberIds: localDeletedMembers };
          const merged = gistSync.mergeData(localForSync, { members: remote.members || [], records: remote.records || [], deletedIds: remote.deletedIds || [], deletedMemberIds: remote.deletedMemberIds || [] });
          // Restore local images
          const localImageMap = new Map();
          (local.records || []).forEach(r => { if (r.imageData) localImageMap.set(r.id, { imageData: r.imageData, imageThumb: r.imageThumb }); });
          const finalRecords = merged.records.map(r => {
            const imgs = localImageMap.get(r.id);
            return imgs ? { ...r, ...imgs } : r;
          });
          setMembers(merged.members);
          setRecords(finalRecords);
          setDeletedIds(merged.deletedIds || []);
          setDeletedMemberIds(merged.deletedMemberIds || []);
          localStorage.setItem("deleted-record-ids", JSON.stringify(merged.deletedIds || []));
          localStorage.setItem(DELETED_MEMBER_IDS_KEY, JSON.stringify(merged.deletedMemberIds || []));
          await storage.save({ members: merged.members, records: finalRecords });
          // Restore aiConfig from Gist if local is empty
          if (remote.aiConfig && remote.aiConfig.apiKey) {
            const localAi = JSON.parse(localStorage.getItem("volcengine-config") || "{}");
            if (!localAi.apiKey) {
              setAiConfig(remote.aiConfig);
              localStorage.setItem("volcengine-config", JSON.stringify(remote.aiConfig));
            }
          }
          // Restore tosConfig from Gist if local is empty
          if (remote.tosConfig && remote.tosConfig.accessKeyId) {
            if (!tosHelper.isConfigured()) {
              tosHelper.saveConfig(remote.tosConfig);
            }
          }
          setSyncStatus("done");
          setTimeout(() => setSyncStatus(""), 2000);
        } catch (e) {
          console.error("Auto sync failed:", e);
          setSyncStatus("error");
          setTimeout(() => setSyncStatus(""), 3000);
        }
      }
      // Fallback: if no members after load+sync (brand new install), use defaults minus deletions
      setMembers(function(cur) {
        if (cur.length > 0) return cur;
        const deleted = new Set(JSON.parse(localStorage.getItem(DELETED_MEMBER_IDS_KEY) || "[]"));
        return DEFAULT_MEMBERS.filter(function(m) { return !deleted.has(m.id); });
      });
    });
  }, []);

  // Save to localStorage
  useEffect(() => {
    if (loaded) storage.save({ members, records });
  }, [members, records, loaded]);

  // Immediate push to Gist
  const pushNow = useCallback(function(newMembers, newRecords, newDeletedIds) {
    if (!gistSync.isConfigured()) return;
    var m = newMembers || members;
    var r = newRecords || records;
    var d = newDeletedIds || JSON.parse(localStorage.getItem("deleted-record-ids") || "[]");
    var dm = JSON.parse(localStorage.getItem(DELETED_MEMBER_IDS_KEY) || "[]");
    var cfg = gistSync.getConfig();
    var pushData = { members: m, records: r.map(function(rec) { return stripBase64(rec); }), deletedIds: d, deletedMemberIds: dm };
    var currentAi = JSON.parse(localStorage.getItem("volcengine-config") || "{}");
    gistSync.push(cfg.token, cfg.gistId, pushData, currentAi).catch(function(e) { console.error("Push failed:", e); });
  }, [members, records]);

  const addRecord = useCallback((record) => {
    setRecords((prev) => {
      const next = [record, ...prev];
      setTimeout(function() { pushNow(null, next); }, 100);
      return next;
    });
    setMode("list");
  }, [pushNow]);

  const deleteRecord = useCallback((id) => {
    setDeletedIds(function(prevDel) {
      const nextDel = prevDel.indexOf(id) === -1 ? prevDel.concat([id]) : prevDel;
      localStorage.setItem("deleted-record-ids", JSON.stringify(nextDel));
      setRecords(function(prev) {
        const next = prev.filter(function(r) { return r.id !== id; });
        setTimeout(function() { pushNow(null, next, nextDel); }, 100);
        return next;
      });
      return nextDel;
    });
  }, [pushNow]);

  const editRecord = useCallback((updated) => {
    setRecords((prev) => {
      const next = prev.map(function(r) { return r.id === updated.id ? Object.assign({}, r, updated) : r; });
      setTimeout(function() { pushNow(null, next); }, 100);
      return next;
    });
  }, [pushNow]);

  // Quick sync: pull remote, merge, push back
  const quickSync = useCallback(async function() {
    if (!gistSync.isConfigured()) { setShowSync(true); return; }
    setSyncStatus("syncing");
    try {
      var cfg = gistSync.getConfig();
      var remote = await gistSync.pull(cfg.token, cfg.gistId);
      var local = await storage.load() || { members: [], records: [] };
      var localDeleted = JSON.parse(localStorage.getItem("deleted-record-ids") || "[]");
      var localDeletedMembers = JSON.parse(localStorage.getItem(DELETED_MEMBER_IDS_KEY) || "[]");
      var localForSync = { members: local.members, records: (local.records || []).map(function(r) { return stripBase64(r); }), deletedIds: localDeleted, deletedMemberIds: localDeletedMembers };
      var remoteClean = { members: remote.members || [], records: remote.records || [], deletedIds: remote.deletedIds || [], deletedMemberIds: remote.deletedMemberIds || [] };
      var merged = gistSync.mergeData(localForSync, remoteClean);
      // Push
      var currentAi = JSON.parse(localStorage.getItem("volcengine-config") || "{}");
      var mergedAi = (currentAi && currentAi.apiKey) ? currentAi : (remote.aiConfig || {});
      await gistSync.push(cfg.token, cfg.gistId, merged, mergedAi);
      // Restore local images
      var localImageMap = new Map();
      (local.records || []).forEach(function(r) { if (r.imageData) localImageMap.set(r.id, { imageData: r.imageData, imageThumb: r.imageThumb }); });
      var finalRecords = merged.records.map(function(r) { var imgs = localImageMap.get(r.id); return imgs ? Object.assign({}, r, imgs) : r; });
      setMembers(merged.members);
      setRecords(finalRecords);
      setDeletedIds(merged.deletedIds || []);
      setDeletedMemberIds(merged.deletedMemberIds || []);
      localStorage.setItem("deleted-record-ids", JSON.stringify(merged.deletedIds || []));
      localStorage.setItem(DELETED_MEMBER_IDS_KEY, JSON.stringify(merged.deletedMemberIds || []));
      await storage.save({ members: merged.members, records: finalRecords });
      // Restore aiConfig
      if (!currentAi.apiKey && remote.aiConfig && remote.aiConfig.apiKey) {
        setAiConfig(remote.aiConfig);
        localStorage.setItem("volcengine-config", JSON.stringify(remote.aiConfig));
      }
      // Restore tosConfig
      if (remote.tosConfig && remote.tosConfig.accessKeyId && !tosHelper.isConfigured()) {
        tosHelper.saveConfig(remote.tosConfig);
      }
      setSyncStatus("done");
      setTimeout(function() { setSyncStatus(""); }, 2000);
    } catch (e) {
      console.error("Quick sync failed:", e);
      setSyncStatus("error");
      setTimeout(function() { setSyncStatus(""); }, 3000);
    }
  }, []);

  const saveAiConfig = (cfg) => {
    setAiConfig(cfg);
    localStorage.setItem("volcengine-config", JSON.stringify(cfg));
  };

  const handleSyncDone = (data, restoredAiConfig) => {
    if (data.members?.length) setMembers(data.members);
    if (data.records?.length) setRecords(data.records);
    if (restoredAiConfig && restoredAiConfig.apiKey) {
      setAiConfig(restoredAiConfig);
      localStorage.setItem("volcengine-config", JSON.stringify(restoredAiConfig));
    }
  };

  const exportData = () => {
    const exportRecords = records.map(r => { return stripBase64(r); });
    const data = { members, records: exportRecords, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `medical-records-${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  const filtered = filterMember === "all" ? records : records.filter((r) => r.memberId === filterMember);
  const sorted = [...filtered].sort((a, b) => { const da = a.date || ""; const db = b.date || ""; if (da !== db) return db.localeCompare(da); return (b.createdAt || 0) - (a.createdAt || 0); });

  const groups = {};
  sorted.forEach((r) => { const key = r.date ? r.date.slice(0, 7) : "未知日期"; if (!groups[key]) groups[key] = []; groups[key].push(r); });

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh", background: "#F5F3F0", fontFamily: "'Noto Sans SC', sans-serif" }}>
      {showSettings && <SettingsModal aiConfig={aiConfig} onSave={saveAiConfig} onClose={() => setShowSettings(false)} onPush={pushNow} />}
      {showSync && <SyncSettingsModal onClose={() => setShowSync(false)} onSyncDone={handleSyncDone} aiConfig={aiConfig} />}
      <div style={{ background: "linear-gradient(135deg, #4A7C6F 0%, #3D6B5F 100%)", padding: "20px 20px 16px", position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 700, color: "#fff", letterSpacing: 1 }}>家庭诊疗记录</div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.6)", marginTop: 2 }}>{records.length} 条记录 · {members.length} 位成员</div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <button onClick={() => setShowSync(true)} style={{
              padding: "6px 10px", borderRadius: 10, border: "1.5px solid rgba(255,255,255,0.3)",
              background: syncStatus === "syncing" ? "rgba(255,255,255,0.3)" : syncStatus === "done" ? "rgba(100,200,150,0.3)" : syncStatus === "error" ? "rgba(200,100,100,0.3)" : "rgba(255,255,255,0.15)",
              fontSize: 12, color: "rgba(255,255,255,0.9)", cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif",
              display: "flex", alignItems: "center", gap: 4,
            }} title="云同步">
              {syncStatus === "syncing" ? <span style={{ display: "inline-block", width: 10, height: 10, border: "1.5px solid rgba(255,255,255,0.3)", borderTopColor: "#fff", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} /> : "☁️"}
              {syncStatus === "done" ? "已同步" : syncStatus === "error" ? "失败" : "同步"}
            </button>
            {records.length > 0 && <button onClick={exportData} style={{
              padding: "6px 10px", borderRadius: 10, border: "1.5px solid rgba(255,255,255,0.3)", background: "rgba(255,255,255,0.15)",
              fontSize: 12, color: "rgba(255,255,255,0.8)", cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif",
            }} title="导出数据">导出</button>}
            <button onClick={() => setShowSettings(true)} style={{
              padding: "6px 10px", borderRadius: 10, border: "1.5px solid rgba(255,255,255,0.3)", background: "rgba(255,255,255,0.15)",
              fontSize: 14, color: "rgba(255,255,255,0.8)", cursor: "pointer",
            }} title="火山引擎配置">⚙️</button>
            <MemberManager members={members} onUpdate={function(nextMembers) {
              const nextIds = new Set(nextMembers.map(function(m) { return m.id; }));
              const removedIds = members.filter(function(m) { return !nextIds.has(m.id); }).map(function(m) { return m.id; });
              const nextDeletedMemberIds = removedIds.length ? Array.from(new Set(deletedMemberIds.concat(removedIds))) : deletedMemberIds;
              setDeletedMemberIds(nextDeletedMemberIds);
              localStorage.setItem(DELETED_MEMBER_IDS_KEY, JSON.stringify(nextDeletedMemberIds));
              setMembers(nextMembers);
              setTimeout(function() { pushNow(nextMembers); }, 100);
            }} />
          </div>
        </div>
      </div>

      <div style={{ padding: "16px 16px 100px" }}>
        {mode === "photo" && (
          <div style={{ background: "#fff", borderRadius: 16, padding: 16, marginBottom: 16, boxShadow: "0 2px 12px rgba(0,0,0,0.06)" }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: "#333", marginBottom: 14 }}>📸 拍照识别</div>
            <PhotoCapture members={members} onSave={addRecord} onCancel={function() { setMode("list"); }} aiConfig={aiConfig} defaultMemberId={filterMember !== "all" ? filterMember : null} />
          </div>
        )}

        {mode === "select-member" && (
          <div style={{ background: "#fff", borderRadius: 16, padding: 20, marginBottom: 16, boxShadow: "0 2px 12px rgba(0,0,0,0.06)" }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: "#333", marginBottom: 4, fontFamily: "'Noto Sans SC', sans-serif" }}>选择成员</div>
            <div style={{ fontSize: 12, color: "#aaa", marginBottom: 16, fontFamily: "'Noto Sans SC', sans-serif" }}>这条记录属于谁？</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {members.map(function(m) { return (
                <button key={m.id} onClick={function() { setFormMemberId(m.id); setMode("select-type"); }} style={{
                  display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderRadius: 12,
                  border: "1.5px solid #e8e5e0", background: "#faf9f7", cursor: "pointer", transition: "all 0.15s",
                  fontFamily: "'Noto Sans SC', sans-serif",
                }}>
                  <span style={{ fontSize: 28 }}>{m.avatar}</span>
                  <span style={{ fontSize: 16, fontWeight: 500, color: m.color }}>{m.name}</span>
                </button>
              ); })}
            </div>
            <button onClick={function() { setMode("list"); }} style={{
              width: "100%", marginTop: 14, padding: "10px", borderRadius: 12, border: "1.5px solid #e8e5e0",
              background: "#fff", fontSize: 14, color: "#888", cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif",
            }}>取消</button>
          </div>
        )}

        {mode === "select-type" && (
          <div style={{ background: "#fff", borderRadius: 16, padding: 20, marginBottom: 16, boxShadow: "0 2px 12px rgba(0,0,0,0.06)" }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: "#333", marginBottom: 4, fontFamily: "'Noto Sans SC', sans-serif" }}>选择类型</div>
            <div style={{ fontSize: 12, color: "#aaa", marginBottom: 16, fontFamily: "'Noto Sans SC', sans-serif" }}>
              {(function() { var m = members.find(function(x) { return x.id === formMemberId; }); return m ? m.avatar + " " + m.name : ""; })()}  ·  记录什么内容？
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {RECORD_TYPES.map(function(t) { return (
                <button key={t.key} onClick={function() { setFormType(t.key); setMode("form"); }} style={{
                  display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderRadius: 12,
                  border: "1.5px solid #e8e5e0", background: "#faf9f7", cursor: "pointer", transition: "all 0.15s",
                  fontFamily: "'Noto Sans SC', sans-serif",
                }}>
                  <span style={{ fontSize: 24 }}>{t.icon}</span>
                  <span style={{ fontSize: 15, fontWeight: 500, color: "#333" }}>{t.label}</span>
                </button>
              ); })}
            </div>
            <button onClick={function() { setMode("select-member"); }} style={{
              width: "100%", marginTop: 14, padding: "10px", borderRadius: 12, border: "1.5px solid #e8e5e0",
              background: "#fff", fontSize: 14, color: "#888", cursor: "pointer", fontFamily: "'Noto Sans SC', sans-serif",
            }}>返回</button>
          </div>
        )}

        {mode === "form" && formType && (
          <div style={{ background: "#fff", borderRadius: 16, padding: 16, marginBottom: 16, boxShadow: "0 2px 12px rgba(0,0,0,0.06)" }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: "#333", marginBottom: 14, fontFamily: "'Noto Sans SC', sans-serif" }}>
              {(function() { var t = RECORD_TYPES.find(function(x) { return x.key === formType; }); return t ? t.icon + " " + t.label : ""; })()}
              <span style={{ fontSize: 12, color: "#aaa", fontWeight: 400, marginLeft: 8 }}>{(function() { var m = members.find(function(x) { return x.id === formMemberId; }); return m ? m.avatar + " " + m.name : ""; })()}</span>
            </div>
            <QuickForm type={formType} memberId={formMemberId} onSave={addRecord} onCancel={function() { setMode("list"); }} aiConfig={aiConfig} />
          </div>
        )}
        {mode === "list" && (
          <>
            <div style={{ display: "flex", gap: 6, marginBottom: 16, overflowX: "auto", paddingBottom: 4 }}>
              <button onClick={() => setFilterMember("all")} style={{
                padding: "5px 14px", borderRadius: 16, border: filterMember === "all" ? "2px solid #4A7C6F" : "2px solid transparent",
                background: filterMember === "all" ? "#4A7C6F18" : "#fff", color: filterMember === "all" ? "#4A7C6F" : "#999",
                fontSize: 13, fontWeight: filterMember === "all" ? 600 : 400, cursor: "pointer", whiteSpace: "nowrap", fontFamily: "'Noto Sans SC', sans-serif",
              }}>全部</button>
              {members.map((m) => <MemberPill key={m.id} member={m} selected={filterMember === m.id} onClick={() => setFilterMember(m.id)} />)}
            </div>
            {Object.keys(groups).length === 0 ? (
              <div style={{ textAlign: "center", padding: "60px 20px", color: "#bbb" }}>
                <div style={{ fontSize: 40, marginBottom: 12 }}>📋</div>
                <div style={{ fontSize: 14 }}>还没有记录</div>
                <div style={{ fontSize: 12, marginTop: 4, color: "#ccc" }}>点击下方按钮开始记录</div>
              </div>
            ) : (
              Object.entries(groups).map(([month, recs]) => (
                <div key={month} style={{ marginBottom: 20 }}>
                  <div style={{ fontSize: 12, fontWeight: 600, color: "#aaa", marginBottom: 8, paddingLeft: 2, fontFamily: "'JetBrains Mono', monospace", letterSpacing: 1 }}>{month}</div>
                  {recs.map((r) => <RecordCard key={r.id} record={r} members={members} onDelete={deleteRecord} onEdit={editRecord} />)}
                </div>
              ))
            )}
          </>
        )}
      </div>

      {mode === "list" && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 12, zIndex: 20 }}>
          <button onClick={() => setMode("photo")} style={{
            width: 56, height: 56, borderRadius: "50%", border: "none", background: "#4A7C6F", color: "#fff",
            fontSize: 24, cursor: "pointer", boxShadow: "0 4px 16px rgba(74,124,111,0.4)",
            display: "flex", alignItems: "center", justifyContent: "center", transition: "transform 0.15s",
          }} onMouseDown={(e) => (e.currentTarget.style.transform = "scale(0.92)")} onMouseUp={(e) => (e.currentTarget.style.transform = "scale(1)")}>📸</button>
          <button onClick={function() { var mid = filterMember !== "all" ? filterMember : null; if (mid) { setFormMemberId(mid); setMode("select-type"); } else { setMode("select-member"); } }} style={{
            width: 56, height: 56, borderRadius: "50%", border: "none", background: "#5B7FA5", color: "#fff",
            fontSize: 24, cursor: "pointer", boxShadow: "0 4px 16px rgba(91,127,165,0.4)",
            display: "flex", alignItems: "center", justifyContent: "center", transition: "transform 0.15s",
          }} onMouseDown={(e) => (e.currentTarget.style.transform = "scale(0.92)")} onMouseUp={(e) => (e.currentTarget.style.transform = "scale(1)")}>✏️</button>
          <button onClick={quickSync} disabled={syncStatus === "syncing"} style={{
            width: 56, height: 56, borderRadius: "50%", border: "none",
            background: syncStatus === "syncing" ? "#aaa" : syncStatus === "done" ? "#4A9C6F" : syncStatus === "error" ? "#C06B5D" : "#8B7BA5",
            color: "#fff", fontSize: 24, cursor: syncStatus === "syncing" ? "default" : "pointer",
            boxShadow: "0 4px 16px rgba(139,123,165,0.4)",
            display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.15s",
          }} onMouseDown={(e) => (e.currentTarget.style.transform = "scale(0.92)")} onMouseUp={(e) => (e.currentTarget.style.transform = "scale(1)")}>
            {syncStatus === "syncing" ? <span style={{ display: "inline-block", width: 24, height: 24, border: "3px solid rgba(255,255,255,0.3)", borderTopColor: "#fff", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} /> : "🔄"}
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MedicalRecords />);
</script>
</body>
</html>
