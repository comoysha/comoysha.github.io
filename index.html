    <style>
      :root { --bg:#f6f8fa; --card:#fff; --text:#111; --muted:#555; --accent:#0b57d0; }

      footer{max-width:920px;margin:20px auto 40px;padding:0 16px;color:var(--muted);font-size:14px}
